name: Serverless Create Test

on:
  schedule:
    - cron: "0/30 * * * *"  # every 30 minutes
  workflow_dispatch:

concurrency:
  group: serverless-create-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up ticloud
        uses: tidbcloud/setup-tidbcloud-cli@v0
        with:
          version: 0.5.2
          api_public_key: ${{ secrets.CREATE_TEST_PUBLIC_KEY }}
          api_private_key: ${{ secrets.CREATE_TEST_PRIVATE_KEY }}

      - name: Delete previous test clusters
        run: |
          ticloud cluster list 1372813089447741295 -o json > cluster
          jq -e '(.items | type == "array") and all(.items[]; (.name | type == "string") and (.id | type == "string"))' cluster > /dev/null
          jq -r '.items[] | select((.name | test("^ci-create-test-(us-east-1|us-west-2|ap-northeast-1|ap-southeast-1|eu-central-1)$"))) | [.id, .name] | @tsv' cluster > clusters-to-delete
          while IFS=$'\t' read -r id name; do
            [[ "$id" =~ ^[0-9]+$ ]] || { echo "Invalid cluster ID" >&2; exit 1; }
            echo "Deleting project=1372813089447741295 cluster=$id name=$name run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
            ticloud cluster delete -p 1372813089447741295 -c "$id" --force
          done < clusters-to-delete

  create-test:
    needs: setup
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        region: [ us-east-1, us-west-2, ap-northeast-1, ap-southeast-1, eu-central-1 ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up ticloud
        uses: tidbcloud/setup-tidbcloud-cli@v0
        with:
          version: 0.5.2
          api_public_key: ${{ secrets.CREATE_TEST_PUBLIC_KEY}}
          api_private_key: ${{ secrets.CREATE_TEST_PRIVATE_KEY }}

      - name: Create cluster
        env:
          TIDB_PASSWORD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run: |
          set +e
          PROJECT_ID=1372813089447741295
          result=`ticloud cluster create -p  $PROJECT_ID --cluster-name ci-create-test-${{ matrix.region }} --cloud-provider AWS -r ${{ matrix.region }} --root-password "$TIDB_PASSWORD" --cluster-type SERVERLESS`
          exitcode="$?"
          if [[ "$exitcode" != "0" ]]; then
            echo $result
            exit "$exitcode"
          fi
          echo $result

          id=`echo $result | sed 's/[^0-9]//g'`
          ticloud cluster get -p $PROJECT_ID -c $id > ${{ matrix.region }}
          exitcode="$?"
          if [[ "$exitcode" != "0" ]]; then
            cat ${{ matrix.region }}
            exit "$exitcode"
          fi
          cat ${{ matrix.region }}
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
          echo "CLUSTER_ID=`echo $(jq '.id' ${{ matrix.region }}) | sed 's/"//g'`" >> $GITHUB_ENV
          echo "CLUSTER_USER=$(jq '.status.connection_strings.default_user' ${{ matrix.region }})" >> $GITHUB_ENV
          echo "CLUSTER_HOST=$(jq '.status.connection_strings.standard.host' ${{ matrix.region }})" >> $GITHUB_ENV

      - name: Create branch
        run: |
          set +e
          result=`ticloud branch create -c ${{ env.CLUSTER_ID }} --branch-name ${{ matrix.region }}`
          exitcode="$?"
          if [[ "$exitcode" != "0" ]]; then
            echo $result
            exit "$exitcode"
          fi
          echo $result

          id=`echo $result | grep -o 'bran-[a-zA-Z0-9]*'`
          ticloud branch get -c ${{ env.CLUSTER_ID }} -b $id > ${{ matrix.region }}
          exitcode="$?"
          if [[ "$exitcode" != "0" ]]; then
            cat ${{ matrix.region }}
            exit "$exitcode"
          fi
          cat ${{ matrix.region }}

          echo "BRANCH_ID=`echo $(jq '.id' ${{ matrix.region }}) | sed 's/"//g'`" >> $GITHUB_ENV
          echo "BRANCH_USER=$(jq '.user_prefix' ${{ matrix.region }})".root"" >> $GITHUB_ENV
          echo "BRANCH_HOST=$(jq '.endpoints.public_endpoint.host' ${{ matrix.region }})" >> $GITHUB_ENV

      - name: Setup mysql
        uses: shogo82148/actions-setup-mysql@v1

      - name: Run test
        env:
          MYSQL_PWD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run: |
          mysql -u ${{ env.CLUSTER_USER }} -h ${{ env.CLUSTER_HOST }} -P 4000 -D test --ssl-mode=VERIFY_IDENTITY --ssl-ca=/etc/ssl/certs/ca-certificates.crt

      - name: Delete cluster & branch
        run: |
          ticloud branch delete -c ${{ env.CLUSTER_ID }} -b ${{ env.BRANCH_ID }} --force
          echo "Deleting project=${{ env.PROJECT_ID }} cluster=${{ env.CLUSTER_ID }} run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
          ticloud cluster delete -p ${{ env.PROJECT_ID }} -c ${{ env.CLUSTER_ID }} --force

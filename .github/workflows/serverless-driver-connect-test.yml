name: Serverless Driver Connect Test

on:
  schedule:
    - cron: "0/10 * * * *"  # every 10 minutes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  us-east-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare connection test
        run: |
          cd example_code/serverless-driver
          npm install @tidbcloud/serverless

      - name: connect cluster us-east-1
        env:
          TIDB_PASSWORD: ${{ secrets.CLUSTER_PSWD_US_EAST_1 }}
        run: |
          cd example_code/serverless-driver
          export DATABASE_URL="mysql://nADWvyBQFXhgZxw.root@gateway01.us-east-1.prod.aws.tidbcloud.com/test"
          node ConnectTest.js


name: Serverless Driver Compatibility Test

on:
  schedule:
    - cron: "0 22 * * *"  # every day at 22:00
  workflow_dispatch:

concurrency:
  group: serverless-compatibility-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up ticloud
        uses: tidbcloud/setup-tidbcloud-cli@v0
        with:
          version: 0.5.2
          api_public_key: ${{ secrets.TLS_PUBLIC_KEY }}
          api_private_key: ${{ secrets.TLS_PRIVATE_KEY }}

      - name: Get Connection Info
        env:
          TIDB_PASSWORD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run: |
          ticloud cluster list 1372813089206721319 -o json > cluster
          jq -e '(.items | type == "array") and all(.items[]; (.name | type == "string") and (.id | type == "string"))' cluster > /dev/null
          jq -r '.items[] | select((.name == "ci-compatibility-tls-test")) | [.id, .name] | @tsv' cluster > clusters-to-delete
          while IFS=$'\t' read -r id name; do
            [[ "$id" =~ ^[0-9]+$ ]] || { echo "Invalid cluster ID" >&2; exit 1; }
            echo "Deleting project=1372813089206721319 cluster=$id name=$name run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
            ticloud cluster delete -p 1372813089206721319 -c "$id" --force
          done < clusters-to-delete
          # create cluster
          ticloud cluster create --project-id 1372813089206721319 --cluster-name ci-compatibility-tls-test --cloud-provider AWS -r us-east-1 --root-password "$TIDB_PASSWORD" --cluster-type SERVERLESS;
          exitcode="$?"
          if [[ "$exitcode" != "0" ]]; then
            exit "$exitcode"
          fi

          # get connection info
          ticloud cluster list 1372813089206721319 -o json > cluster
          exitcode="$?"
          if [[ "$exitcode" != "0" ]]; then
            cat cluster
            exit "$exitcode"
          fi

          jq -e '[.items[] | select(.name == "ci-compatibility-tls-test")] | length == 1' cluster > /dev/null
          user=$(jq -er '.items[] | select(.name == "ci-compatibility-tls-test") | .status.connection_strings.default_user | select(type == "string" and length > 0)' cluster)
          host=$(jq -er '.items[] | select(.name == "ci-compatibility-tls-test") | .status.connection_strings.standard.host | select(type == "string" and length > 0)' cluster)
          echo "TIDB_CLOUD_USER=$user" >> "$GITHUB_ENV"
          echo "TIDB_CLOUD_HOST=$host" >> "$GITHUB_ENV"
    outputs:
      TiDB_CLOUD_USER: ${{ env.TIDB_CLOUD_USER }}
      TiDB_CLOUD_HOST: ${{ env.TIDB_CLOUD_HOST }}

  mysql:
    needs: setup
    strategy:
      matrix:
        os: [ ubuntu-24.04, windows-2022, macos-14 ]
        include:
          - os: ubuntu-24.04
            cert: /etc/ssl/certs/ca-certificates.crt
          - os: macos-14
            cert: /etc/ssl/cert.pem
          - os: windows-2022
            cert: ./example_code/x1.pem
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get mysql
        uses: shogo82148/actions-setup-mysql@v1

      - name: Run test on ${{ matrix.os }}
        env:
          MYSQL_PWD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run: mysql -u ${{needs.setup.outputs.TIDB_CLOUD_USER}} -h ${{needs.setup.outputs.TIDB_CLOUD_HOST}} -P 4000 -D test --ssl-mode=VERIFY_IDENTITY --ssl-ca=${{ matrix.cert }}

  no_tls:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        port: [ 4000, 3306 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get mysql
        uses: shogo82148/actions-setup-mysql@v1

      - name: Run test
        env:
          MYSQL_PWD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run: "! mysql -u ${{needs.setup.outputs.TIDB_CLOUD_USER}} -h ${{needs.setup.outputs.TIDB_CLOUD_HOST}} -P ${{ matrix.port }} -D test --ssl-mode=DISABLED"

  invalid_tls_version:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        tls: [ TLSv1, TLSv1.1 ]
        port: [ 4000, 3306 ]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
      - name: Prepare connection test
        run: |
          # Starting from 8.0.26, TLSv1 & TLSv1.1 are deprecated. From 8.0.28, they are completely removed.
          pip3 install mysql-connector-python==8.0.25 --break-system-packages
          cd example_code/python

      - name: Run test on ${{ matrix.tls }}
        env:
          TIDB_PASSWORD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run: |
          cd example_code/python
          ! python3 tls_version.py ${{needs.setup.outputs.TIDB_CLOUD_HOST}} ${{ matrix.port }} ${{needs.setup.outputs.TIDB_CLOUD_USER}} /etc/ssl/certs/ca-certificates.crt ${{ matrix.tls }}

  valid_tls_version:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        tls: [ TLSv1.2, TLSv1.3 ]
        port: [ 4000, 3306 ]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
      - name: Prepare connection test
        run: |
          pip3 install mysql-connector-python --break-system-packages
          cd example_code/python

      - name: Run test on ${{ matrix.tls }}
        env:
          TIDB_PASSWORD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run: |
          cd example_code/python
          python3 tls_version.py ${{needs.setup.outputs.TIDB_CLOUD_HOST}} ${{ matrix.port }} ${{needs.setup.outputs.TIDB_CLOUD_USER}} /etc/ssl/certs/ca-certificates.crt ${{ matrix.tls }}

  mycli:
    needs: setup
    strategy:
      matrix:
        os: [ ubuntu-24.04, windows-2022, macos-14 ]
        include:
          - os: ubuntu-24.04
            cert: /etc/ssl/certs/ca-certificates.crt
          - os: macos-14
            cert: /etc/ssl/cert.pem
          - os: windows-2022
            cert: ./example_code/x1.pem
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install python
        uses: actions/setup-python@v5

      - name: Install mycli
        run: pip3 install mycli --break-system-packages

      - name: Run test on ${{ matrix.os }}
        env:
          MYSQL_PWD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run:
          mycli -u ${{needs.setup.outputs.TIDB_CLOUD_USER}} -h ${{needs.setup.outputs.TIDB_CLOUD_HOST}} -P 4000 -D test --ssl-ca=${{ matrix.cert }} --ssl-verify-server-cert

  java_jdbc:
    needs: setup
    strategy:
      matrix:
        os: [ ubuntu-24.04, windows-2022, macos-14 ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '17'
      - name: Prepare connection test
        if: ${{ matrix.os != 'windows-2022' }}
        run: |
          cd example_code/java
          javac ConnectTest.java

      - name: Run test on ubuntu or macos
        if: ${{ matrix.os != 'windows-2022' }}
        env:
          TIDB_PASSWORD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run: |
          cd example_code/java
          java -cp mysql-connector-j-8.0.31.jar: ConnectTest ${{needs.setup.outputs.TIDB_CLOUD_USER}} ${{needs.setup.outputs.TIDB_CLOUD_HOST}}

      - name: Prepare connection test
        if: ${{ matrix.os == 'windows-2022' }}
        # Need to use Chinese semicolon and an extra space before ConnectTest （don't know why）
        run: |
          cd example_code/java
          javac ConnectTest.java

      - name: Run test on windows
        if: ${{ matrix.os == 'windows-2022' }}
        # Need to use Chinese semicolon and an extra space before ConnectTest （don't know why）
        env:
          TIDB_PASSWORD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run: |
          cd example_code/java
          java -cp mysql-connector-j-8.0.31.jar； ConnectTest ${{needs.setup.outputs.TIDB_CLOUD_USER}} ${{needs.setup.outputs.TIDB_CLOUD_HOST}}

  # https://jira.mariadb.org/browse/CONJ-1023
  java_jdbc_mariadb_CONJ-1023:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '17'
      - name: Prepare connection test
        run: |
          cd example_code/java
          javac ConnectTestMariaDB.java

      - name: Run test
        env:
          TIDB_PASSWORD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run: |
          cd example_code/java
          java -cp mariadb-java-client-3.0.9.jar: ConnectTestMariaDB ${{needs.setup.outputs.TIDB_CLOUD_USER}} ${{needs.setup.outputs.TIDB_CLOUD_HOST}}

  python_mysqlclient:
    needs: setup
    strategy:
      matrix:
        os: [ ubuntu-24.04, windows-2022, macos-14 ]
        include:
          - os: ubuntu-24.04
            cert: /etc/ssl/certs/ca-certificates.crt
          - os: macos-14
            cert: /etc/ssl/cert.pem
          - os: windows-2022
            cert: ../x1.pem
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
      - name: Install mysql in macos
        if: ${{ matrix.os == 'macos-14' }}
        run: |
          brew install mysql-client
          export PKG_CONFIG_PATH="/opt/homebrew/opt/mysql-client/lib/pkgconfig"
          pip3 install mysqlclient --break-system-packages
      - name: Prepare connection test
        run: |
          pip3 install mysqlclient --break-system-packages
          cd example_code/python

      - name: Run test on ${{ matrix.os }}
        env:
          TIDB_PASSWORD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run: |
          cd example_code/python
          python3 ConnectTest_mysqlclient.py ${{needs.setup.outputs.TIDB_CLOUD_HOST}} ${{needs.setup.outputs.TIDB_CLOUD_USER}} ${{ matrix.cert }}

  python_mysql_connector:
    needs: setup
    strategy:
      matrix:
        os: [ ubuntu-24.04, windows-2022, macos-14 ]
        include:
          - os: ubuntu-24.04
            cert: /etc/ssl/certs/ca-certificates.crt
          - os: macos-14
            cert: /etc/ssl/cert.pem
          - os: windows-2022
            cert: ../x1.pem
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
      - name: Prepare connection test
        run: |
          pip3 install mysql-connector-python --break-system-packages
          cd example_code/python

      - name: Run test on ${{ matrix.os }}
        env:
          TIDB_PASSWORD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run: |
          cd example_code/python
          python3 ConnectTest_mysql-connector-python.py ${{needs.setup.outputs.TIDB_CLOUD_HOST}} ${{needs.setup.outputs.TIDB_CLOUD_USER}} ${{ matrix.cert }}

  python_pymysql:
    needs: setup
    strategy:
      matrix:
        os: [ ubuntu-24.04, windows-2022, macos-14 ]
        include:
          - os: ubuntu-24.04
            cert: /etc/ssl/certs/ca-certificates.crt
          - os: macos-14
            cert: /etc/ssl/cert.pem
          - os: windows-2022
            cert: ../x1.pem
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
      - name: Prepare connection test
        run: |
          pip3 install pymysql --break-system-packages
          cd example_code/python

      - name: Run test on ${{ matrix.os }}
        env:
          TIDB_PASSWORD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run: |
          cd example_code/python
          python3 ConnectTest_pymysql.py ${{needs.setup.outputs.TIDB_CLOUD_HOST}} ${{needs.setup.outputs.TIDB_CLOUD_USER}} ${{ matrix.cert }}

  python_sqlalchemy:
    needs: setup
    strategy:
      matrix:
        os: [ ubuntu-24.04, windows-2022, macos-14 ]
        include:
          - os: ubuntu-24.04
            cert: /etc/ssl/certs/ca-certificates.crt
          - os: macos-14
            cert: /etc/ssl/cert.pem
          - os: windows-2022
            cert: ../x1.pem
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
      - name: Install mysql in macos
        if: ${{ matrix.os == 'macos-14' }}
        run: |
          brew install mysql-client
          export PKG_CONFIG_PATH="/opt/homebrew/opt/mysql-client/lib/pkgconfig"
          pip3 install mysqlclient --break-system-packages
      - name: Prepare connection test
        run: |
          pip3 install mysqlclient --break-system-packages
          pip3 install sqlalchemy --break-system-packages
          cd example_code/sqlalchemy

      - name: Run test on ${{ matrix.os }}
        env:
          TIDB_PASSWORD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run: |
          cd example_code/sqlalchemy
          python3 ConnectTest.py ${{needs.setup.outputs.TIDB_CLOUD_HOST}} ${{needs.setup.outputs.TIDB_CLOUD_USER}} ${{ matrix.cert }}

  go_godriver:
    needs: setup
    strategy:
      matrix:
        os: [ ubuntu-24.04, windows-2022, macos-14 ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'example_code/go/go.mod'
          cache-dependency-path: 'example_code/go/go.sum'
      - name: Prepare connection test
        run: |
          cd example_code/go
          go mod tidy

      - name: Run test on ${{ matrix.os }}
        env:
          TIDB_PASSWORD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run: |
          cd example_code/go
          go run ConnectTest.go ${{needs.setup.outputs.TIDB_CLOUD_HOST}} ${{needs.setup.outputs.TIDB_CLOUD_USER}}

  go_gorm:
    needs: setup
    strategy:
      matrix:
        os: [ ubuntu-24.04, windows-2022, macos-14 ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'example_code/gorm/go.mod'
          cache-dependency-path: 'example_code/gorm/go.sum'
      - name: Prepare connection test
        run: |
          cd example_code/gorm
          go mod tidy

      - name: Run test on ${{ matrix.os }}
        env:
          TIDB_PASSWORD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run: |
          cd example_code/gorm
          go run ConnectTest.go ${{needs.setup.outputs.TIDB_CLOUD_HOST}} ${{needs.setup.outputs.TIDB_CLOUD_USER}}

  node_mysql2:
    needs: setup
    strategy:
      matrix:
        os: [ ubuntu-24.04, windows-2022, macos-14 ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      - name: Prepare connection test
        run: |
          cd example_code/node
          npm install --save mysql2

      - name: Run test on ${{ matrix.os }}
        env:
          TIDB_PASSWORD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run: |
          cd example_code/node
          node ConnectTest.js ${{needs.setup.outputs.TIDB_CLOUD_HOST}} ${{needs.setup.outputs.TIDB_CLOUD_USER}}

  node_sequelize:
    needs: setup
    strategy:
      matrix:
        os: [ ubuntu-24.04, windows-2022, macos-14 ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      - name: Prepare connection test
        run: |
          cd example_code/sequelize
          npm install --save mysql2
          npm install --save sequelize

      - name: Run test on ${{ matrix.os }}
        env:
          TIDB_PASSWORD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run: |
          cd example_code/sequelize
          node ConnectTest.js ${{needs.setup.outputs.TIDB_CLOUD_HOST}} ${{needs.setup.outputs.TIDB_CLOUD_USER}}

  rust_mysql:
    needs: setup
    strategy:
      matrix:
        os: [ windows-2022, macos-14 ] # skip ubuntu-24.04 as it get stuck for unknown reasons
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run test on ${{ matrix.os }}
        env:
          TIDB_PASSWORD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run: |
          cd example_code/rust
          cargo run ${{needs.setup.outputs.TIDB_CLOUD_HOST}} ${{needs.setup.outputs.TIDB_CLOUD_USER}}

  ruby_mysql2:
    needs: setup
    strategy:
      matrix:
        os: [ ubuntu-24.04, macos-14 ] # install mysql2 in windows is a little difficult, dismiss it for now
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Prepare connection test
        if: ${{ matrix.os == 'macos-14' }}
        run: |
          brew install mysql@8.0
          cd example_code/ruby
          # https://github.com/Homebrew/homebrew-core/issues/130258
          gem install mysql2 -- --with-mysql-dir=$(brew --prefix mysql@8.0)

      - name: Install mysql on macos
        if: ${{ matrix.os == 'macos-14' }}
        env:
          TIDB_PASSWORD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run: |
          cd example_code/ruby
          ruby ConnectTest.rb ${{needs.setup.outputs.TIDB_CLOUD_HOST}} ${{needs.setup.outputs.TIDB_CLOUD_USER}}
      - name: Prepare connection test
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: |
          cd example_code/ruby
          gem install mysql2

      - name: Run test on ubuntu
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        env:
          TIDB_PASSWORD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run: |
          cd example_code/ruby
          ruby ConnectTest.rb ${{needs.setup.outputs.TIDB_CLOUD_HOST}} ${{needs.setup.outputs.TIDB_CLOUD_USER}}

  php_mysqli:
    needs: setup
    strategy:
      matrix:
        os: [ ubuntu-24.04, windows-2022, macos-14 ]
        include:
          - os: ubuntu-24.04
            cert: /etc/ssl/certs/ca-certificates.crt
          - os: macos-14
            cert: /etc/ssl/cert.pem
          - os: windows-2022
            cert: ../x1.pem
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          ini-values: extension=php_mysqli.dll
      - name: Run test on ${{ matrix.os }}
        env:
          TIDB_PASSWORD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run: |
          cd example_code/php
          php ConnectTest.php ${{needs.setup.outputs.TIDB_CLOUD_HOST}} ${{needs.setup.outputs.TIDB_CLOUD_USER}} ${{matrix.cert}}

  cpp_libmysqlclient:
    needs: setup
    strategy:
      matrix:
        os: [ ubuntu-24.04, macos-14 ]
        include:
          - os: ubuntu-24.04
            cert: /etc/ssl/certs/ca-certificates.crt
          - os: macos-14
            cert: /etc/ssl/cert.pem
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: rlalik/setup-cpp-compiler@v1.2
      - name: Prepare connection test
        if: ${{ matrix.os == 'macos-14' }}
        run: |
          brew install mysql-client
          export PKG_CONFIG_PATH="/opt/homebrew/opt/mysql-client/lib/pkgconfig"
          flags=$(pkg-config --cflags --libs mysqlclient)
          cd example_code/cpp
          eval "g++ ConnectTest.cpp -o test $flags"

      - name: Run test on macos
        if: ${{ matrix.os == 'macos-14' }}
        env:
          TIDB_PASSWORD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run: |
          cd example_code/cpp
          ./test ${{needs.setup.outputs.TIDB_CLOUD_HOST}} ${{needs.setup.outputs.TIDB_CLOUD_USER}} ${{matrix.cert}}
      - name: Prepare connection test
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: |
          sudo apt install -y libmysqlclient-dev
          cd example_code/cpp
          g++ ConnectTest.cpp -o test -I/usr/include/mysql -lmysqlclient

      - name: Run test on ubuntu
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        env:
          TIDB_PASSWORD: ${{ secrets.TIDB_CLOUD_PASSWORD }}
        run: |
          cd example_code/cpp
          ./test ${{needs.setup.outputs.TIDB_CLOUD_HOST}} ${{needs.setup.outputs.TIDB_CLOUD_USER}} ${{matrix.cert}}
